<div *ngIf="state().isOpen" class="dialog-overlay" (click)="ok()">
  <div class="dialog-container" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h2>{{ state().config?.title }}</h2>
    </div>

    <div class="dialog-body">
      <p>{{ state().config?.message }}</p>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn-secondary" (click)="ok()">
        {{ state().config?.okText }}
      </button>
    </div>
  </div>
</div>
